[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deadcode"
version = "0.1.0"
description = "Deterministic static-analysis engine for finding unused Python code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["deadcode"]
branch = true

[tool.coverage.report]
show_missing = true

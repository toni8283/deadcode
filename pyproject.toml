[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcode"
version = "0.1.0"
description = "Find and safely remove unused Python code — with proof."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
deadcode = "deadcode.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["deadcode"]
branch = true

[tool.coverage.report]
show_missing = true
